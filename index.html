<title>Acessos por Cargo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — header com abas; Responder = lista de cargos à esquerda + formulário por categoria à direita; Painel = resumo, progresso por setor, tabela */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunken:#eaf0ef; --ink:#13201f; --muted:#5a6a68; --line:#d6e0de;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#dff0ed;
  --ok:#2c7a38; --ok-soft:#e2f2e4; --warn:#9a5b00; --warn-soft:#fbefd9; --danger:#b3261e; --danger-soft:#fbe4e2;
  --f-display:"Instrument Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#152120; --sunken:#101a19; --ink:#e3edeb; --muted:#93a5a2; --line:#273633;
  --accent:#4dc0b2; --accent-ink:#06201d; --accent-soft:#163532;
  --ok:#6cc47a; --ok-soft:#173222; --warn:#e3a84d; --warn-soft:#33270f; --danger:#f08a82; --danger-soft:#3a1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#152120; --sunken:#101a19; --ink:#e3edeb; --muted:#93a5a2; --line:#273633;
  --accent:#4dc0b2; --accent-ink:#06201d; --accent-soft:#163532;
  --ok:#6cc47a; --ok-soft:#173222; --warn:#e3a84d; --warn-soft:#33270f; --danger:#f08a82; --danger-soft:#3a1916; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:66ch}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:7px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.err{background:var(--danger-soft);border-color:transparent}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
select,input[type=text],input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.meta{color:var(--muted);font-size:13px}

/* Responder */
.resp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.resp{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.side{position:static}}
.cargos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto}
.cargos button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer}
.cargos button:hover{background:var(--sunken)}
.cargos button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cargos .nm{font-size:13px;min-width:0}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.areaprog{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}

.editor{display:flex;flex-direction:column;gap:14px;min-width:0}
.edhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.edhead h2{font-family:var(--f-display);font-size:20px;margin:2px 0 4px;text-wrap:balance}
.steps{display:flex;gap:4px}
.steps i{width:22px;height:6px;border-radius:99px;background:var(--sunken);border:1px solid var(--line)}
.steps i.on{background:var(--ok);border-color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat.missing{border-color:var(--warn)}
.cat-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px}
.cat-h h3{font-family:var(--f-display);font-size:16px;margin:0}
.cat-h .hint{color:var(--muted);font-size:12.5px}
.cat-b{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--sunken)}
.answer{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.answer button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13.5px}
.answer button+button{border-left:1px solid var(--line)}
.answer button[aria-pressed="true"][data-v="precisa"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.answer button[aria-pressed="true"][data-v="nao"]{background:var(--ink);color:var(--surface);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.opt::before{content:"";width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.opt[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.other{display:flex;gap:6px;max-width:460px}
.rows{display:flex;flex-direction:column;gap:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) auto auto minmax(0,1.6fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.irow .nm{font-weight:600;align-self:center}
.irow .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.irow .f label,.irow .f span.l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media (max-width:900px){.irow{grid-template-columns:1fr 1fr}.irow .nm{grid-column:1/-1}.irow .f.w{grid-column:1/-1}.irow .rm{grid-column:1/-1;justify-self:end}}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.savebar .st{font-size:13px;color:var(--muted)}
.savebar .st.dirty{color:var(--warn);font-weight:600}
.savebar .st.err{color:var(--danger);font-weight:600}
.savebar .st.ok{color:var(--ok);font-weight:600}

/* Painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi small{color:var(--muted)}
.panel{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.panel{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-family:var(--f-display);font-size:15px;margin:0 0 10px}
.arealist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:640px;overflow:auto}
.arealist button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.arealist button:hover{background:var(--sunken)}
.arealist button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.arealist .n{font-size:12.5px}
.arealist .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.arealist .bar{grid-column:1/-1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 220px;width:auto}
.filters select{flex:0 1 230px;width:auto}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunken);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.cg{font-weight:600}
td .sm{display:block;color:var(--muted);font-size:12px;font-weight:400}
tr.np td{color:var(--muted)}
.yn{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.yn.s{background:var(--accent-soft);color:var(--accent)}
.yn.n{background:var(--sunken);color:var(--muted)}
.pend{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pend li{font-size:13px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
body{margin:0}
[hidden]{display:none!important}
.who{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.who .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.who h3{grid-column:1/-1;font-family:var(--f-display);font-size:15px;margin:0}

.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}

.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>

const CATS = [

const CARGOS = []; AREAS.forEach(([area, list], ai) => list.forEach((cargo, ci) => CARGOS.push({ id:`a${ai}c${ci}`, ai, area, cargo })));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const toDate = v => !v ? null : (v.toDate ? v.toDate() : new Date(v));
const fmtDate = v => { const d=toDate(v); return !d||isNaN(d)?"":d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} },
  json(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } }
};
const newItem = rec => ({ recurso:rec, dia1:"Sim", obs:"", responsavel:"" });
const emptyCats = () => Object.fromEntries(CATS.map(c=>[c.k,{ estado:null, itens:[] }]));
const answered = cs => CATS.filter(c => cs[c.k] && (cs[c.k].estado==="nao" || (cs[c.k].estado==="precisa" && cs[c.k].itens.length))).length;
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

const S = {
  user:null, isRH:false, status:{}, resp:{}, loaded:false, slow:false, err:null,
  mine: store.json("acc-mine", {}),            // respostas enviadas deste navegador
  who: store.json("acc-who", { nome:"", email:"" }),
  area:0, cargo:null, draft:null, dirty:false, msg:null, saving:false, pendingGo:null, showMissing:false,
  pArea:-1, pq:"", pCat:"",
  login:{ email:"", msg:null, busy:false }
};
let unsubResp = null;

function route(){ return location.hash === "#painel" ? "painel" : "responder"; }
function render(){
  const r = route();
  $("tab-responder").setAttribute("aria-current", r==="responder" ? "page" : "false");
  $("tab-painel").setAttribute("aria-current", r==="painel" ? "page" : "false");
  $("tab-painel").hidden = !S.isRH;
  $("btn-logout").hidden = !S.user;
  $("rh-link").hidden = S.isRH;
  renderNotices();
  if (r === "painel") { if (S.isRH) renderPainel(); else renderLogin(); }
  else renderResponder();
}
function renderNotices(){
  const n = [];
  if (S.err) n.push(`<div class="notice err"><b>Não foi possível carregar os dados.</b> ${esc(S.err)}</div>`);
  else if (S.slow && !S.loaded) n.push(`<div class="notice warn">Os dados ainda não carregaram. Verifique sua conexão.</div>`);
  $("notices").innerHTML = n.join("");
}
function status(id){
  const s = S.status[id];
  if (!s) return { cls:"no", txt:"Pendente" };
  return { cls:"ok", txt:`Respondido · ${s.nItens ?? 0} ${s.nItens===1?"item":"itens"}` };
}
function areaDone(ai){ const l = CARGOS.filter(c=>c.ai===ai); return [l.filter(c=>S.status[c.id]).length, l.length]; }

function docToCats(r){
  const cs = emptyCats(); if (!r) return cs;
  (r.naoPrecisa||[]).forEach(k => { if (cs[k]) cs[k].estado = "nao"; });
  (r.itens||[]).forEach(it => { const c = cs[catOf(it)]; c.estado = "precisa"; c.itens.push({ recurso:it.recurso, dia1:it.dia1, obs:it.obs||"", responsavel:it.responsavel||"" }); });
  return cs;
}
function savedCats(id){
  if (S.isRH && S.resp[id]) return docToCats(S.resp[id]);
  if (S.mine[id]) return clone(S.mine[id].cats);
  return null;
}

/* ---------- RESPONDER ---------- */
function renderResponder(){
  const [d, t] = areaDone(S.area);
  const list = CARGOS.filter(c => c.ai === S.area);
  $("view").innerHTML = `
  <div class="resp">
    <aside class="side" aria-label="Escolha do cargo">
      <div style="display:flex;flex-direction:column;gap:4px">
        <label class="label" for="sel-area">Setor</label>
        <select id="sel-area">${AREAS.map(([a],i)=>`<option value="${i}" ${i===S.area?"selected":""}>${esc(a)}</option>`).join("")}</select>
      </div>
      <div>
        <div class="areaprog">${d} de ${t} cargos respondidos</div>
        <div class="bar" style="margin-top:4px"><i style="width:${t?Math.round(d/t*100):0}%"></i></div>
      </div>
      <ul class="cargos" id="cargo-list">${list.map(c=>{const s=status(c.id);return `<li><button type="button" data-cargo="${c.id}" aria-current="${c.id===S.cargo}"><span class="nm">${esc(c.cargo)}</span><span class="pill ${s.cls}">${s.txt}</span></button></li>`}).join("")}</ul>
    </aside>
    <section class="editor" id="editor">${editorHTML()}</section>
  </div>`;
  $("sel-area").onchange = e => go({ area:+e.target.value });
  $("cargo-list").onclick = e => { const b=e.target.closest("[data-cargo]"); if(b) go({ cargo:b.dataset.cargo }); };
  bindEditor();
}
function go(t){
  if (t.cargo && t.cargo===S.cargo) return;
  S.dirty = false; applyGo(t);
}
function applyGo(t){
  S.pendingGo = null; S.msg = null; S.showMissing = false;
  if (t.area !== undefined) { S.area = t.area; store.set("acc-area", String(t.area)); S.cargo = null; S.draft = null; S.dirty = false; }
  if (t.cargo !== undefined) { S.cargo = t.cargo; loadDraft(); }
  renderResponder();
  if (t.cargo && matchMedia("(max-width:860px)").matches) $("editor")?.scrollIntoView({ block:"start", behavior:"smooth" });
}
function loadDraft(){ S.draft = { cats: savedCats(S.cargo) || emptyCats() }; S.dirty = false; }

function editorHTML(){
  if (!S.cargo) return `<div class="empty"><b>Escolha um cargo na lista</b><br>Selecione o setor e clique no cargo para responder as ${CATS.length} categorias.</div>`;
  const c = BYID[S.cargo], st = S.status[S.cargo], cs = S.draft.cats, done = answered(cs);
  let meta = "Ainda não respondido.";
  if (st) {
    meta = `Respondido em ${fmtDate(st.atualizadoEm)}`;
    if (S.isRH && S.resp[S.cargo]) meta += ` por ${esc(S.resp[S.cargo].respondenteNome)}`;
    if (!S.isRH && !S.mine[S.cargo]) meta += `. Se você enviar de novo, a resposta anterior será substituída.`;
  }
  return `
  <div class="edhead">
    <div style="min-width:0">
      <div class="label">${esc(c.area)}</div>
      <h2>${esc(c.cargo)}</h2>
      <div class="meta">${meta}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <span class="meta"><b style="color:var(--ink)">${done} de ${CATS.length}</b> categorias respondidas</span>
      <span class="steps">${CATS.map(k=>`<i class="${answered({[k.k]:cs[k.k]})?"on":""}" title="${esc(k.n)}"></i>`).join("")}</span>
    </div>
  </div>
  ${CATS.map(k => catHTML(k, cs[k.k])).join("")}
  <div class="who">
    <h3>Quem está respondendo</h3>
    <div class="f"><label class="label" for="who-nome">Seu nome</label><input type="text" id="who-nome" data-who="nome" value="${esc(S.who.nome)}" autocomplete="name" maxlength="120"></div>
    <div class="f"><label class="label" for="who-email">Seu e-mail corporativo</label><input type="text" id="who-email" data-who="email" value="${esc(S.who.email)}" autocomplete="email" inputmode="email" maxlength="200"></div>
  </div>
  <div class="savebar">
    <span class="st ${S.msg?S.msg.cls:(S.dirty?"dirty":"")}" id="save-st">${S.msg?esc(S.msg.txt):(S.dirty?"Alterações não salvas":`Faltam ${CATS.length-done} categorias`)}</span>
    <div class="toolbar">
      ${S.pendingGo ? `<button type="button" class="btn ghost" data-act="discard">Descartar e sair</button>` : (S.dirty ? `<button type="button" class="btn ghost" data-act="undo">Desfazer alterações</button>` : "")}
      <button type="button" class="btn primary" data-act="save" ${S.saving?"disabled":""}>${S.saving?"Enviando…":(S.pendingGo?"Enviar e continuar":"Enviar respostas")}</button>
    </div>
  </div>`;
}
function catHTML(k, st){
  const missing = S.showMissing && !answered({[k.k]:st});
  const names = st.itens.map(i=>i.recurso);
  const customs = names.filter(n => !k.opts.includes(n));
  const body = st.estado !== "precisa" ? "" : `
    <div class="cat-b">
      ${(k.opts.length||customs.length) ? `<div class="opts">${k.opts.map(o=>`<button type="button" class="opt" data-act="toggle" data-k="${k.k}" data-v="${esc(o)}" aria-pressed="${names.includes(o)}">${esc(o)}</button>`).join("")}${customs.map(o=>`<button type="button" class="opt" data-act="toggle" data-k="${k.k}" data-v="${esc(o)}" aria-pressed="true">${esc(o)}</button>`).join("")}</div>` : ""}
      <div class="other">
        <input type="text" id="other-${k.k}" data-other="${k.k}" maxlength="120" placeholder="${k.k==="sist"?"Outro sistema ou app (digite o nome)":k.k==="share"?"Outro site do SharePoint (ex.: Qualidade)":"Outro item"}">
        <button type="button" class="btn" data-act="add" data-k="${k.k}">Adicionar</button>
      </div>
      ${st.itens.length ? `<div class="rows">${st.itens.map((it,i)=>rowHTML(k.k,it,i)).join("")}</div>` : `<div class="meta">Marque pelo menos um item${k.opts.length?" acima":""} ou adicione pelo nome. Se não precisar de nada, escolha “Não precisa”.</div>`}
    </div>`;
  return `<section class="cat ${missing?"missing":""}" id="cat-${k.k}">
    <div class="cat-h">
      <div><h3>${esc(k.n)}</h3>${k.hint?`<div class="hint">${esc(k.hint)}</div>`:""}${missing?`<div class="hint" style="color:var(--warn);font-weight:600">Responda esta categoria</div>`:""}</div>
      <div class="answer" role="group" aria-label="${esc(k.n)}">
        <button type="button" data-act="estado" data-k="${k.k}" data-v="precisa" aria-pressed="${st.estado==="precisa"}">Precisa</button>
        <button type="button" data-act="estado" data-k="${k.k}" data-v="nao" aria-pressed="${st.estado==="nao"}">Não precisa</button>
      </div>
    </div>${body}
  </section>`;
}
function rowHTML(kk, it, i){
  const seg = (f, v) => `<div class="seg" role="group">${["Sim","Não"].map(o=>`<button type="button" data-act="seg" data-k="${kk}" data-i="${i}" data-f="${f}" data-v="${o}" aria-pressed="${v===o}">${o}</button>`).join("")}</div>`;
  return `<div class="irow">
    <div class="nm">${esc(it.recurso)}</div>
    <div class="f"><span class="l">Desde o 1º dia?</span>${seg("dia1", it.dia1)}</div>
    <div class="f w"><label for="obs-${kk}-${i}">Observações</label><input type="text" id="obs-${kk}-${i}" data-in="obs" data-k="${kk}" data-i="${i}" value="${esc(it.obs)}" maxlength="500" placeholder="Módulos, perfil, especificações"></div>
    <div class="f"><label for="rsp-${kk}-${i}">Responsável (opcional)</label><input type="text" id="rsp-${kk}-${i}" data-in="responsavel" data-k="${kk}" data-i="${i}" value="${esc(it.responsavel)}" maxlength="120" placeholder="Ex.: Gestor da área"></div>
    <button type="button" class="btn ghost rm" data-act="rm" data-k="${kk}" data-i="${i}" aria-label="Remover ${esc(it.recurso)}">Remover</button>
  </div>`;
}
function setDirty(){ S.dirty = true; if (!S.pendingGo) S.msg = null; }
function rerenderEditor(){
  const ed = $("editor"); if (!ed) return;
  const a = document.activeElement, id = a && a.id, ss = a && a.selectionStart;
  ed.innerHTML = editorHTML(); bindEditor();
  if (id && $(id)) { $(id).focus(); try{ if(ss!=null) $(id).setSelectionRange(ss,ss) }catch(e){} }
}
function addCustom(kk){
  const inp = $("other-"+kk); const v = (inp?.value||"").trim(); if (!v) return;
  const st = S.draft.cats[kk];
  if (!st.itens.some(i=>i.recurso.toLowerCase()===v.toLowerCase())) st.itens.push(newItem(v));
  setDirty(); rerenderEditor(); $("other-"+kk)?.focus();
}
function bindEditor(){
  const ed = $("editor"); if (!ed || !S.draft) return;
  ed.oninput = e => {
    const w = e.target.dataset.who;
    if (w) { S.who[w] = e.target.value; store.set("acc-who", JSON.stringify(S.who)); return; }
    const f = e.target.dataset.in; if (!f) return;
    S.draft.cats[e.target.dataset.k].itens[+e.target.dataset.i][f] = e.target.value;
    const first = !S.dirty; setDirty();
    if (first) rerenderEditor(); else { const st=$("save-st"); if(st && !S.pendingGo){ st.className="st dirty"; st.textContent="Alterações não salvas"; } }
  };
  ed.onkeydown = e => { if (e.key==="Enter" && e.target.dataset.other) { e.preventDefault(); addCustom(e.target.dataset.other); } };
  ed.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const act = b.dataset.act, kk = b.dataset.k, st = kk && S.draft.cats[kk];
    if (act==="estado") { st.estado = st.estado===b.dataset.v ? null : b.dataset.v; setDirty(); rerenderEditor(); return; }
    if (act==="toggle") { const v=b.dataset.v, i=st.itens.findIndex(x=>x.recurso===v); if(i>=0) st.itens.splice(i,1); else st.itens.push(newItem(v)); setDirty(); rerenderEditor(); return; }
    if (act==="add") { addCustom(kk); return; }
    if (act==="rm") { st.itens.splice(+b.dataset.i,1); setDirty(); rerenderEditor(); return; }
    if (act==="seg") { st.itens[+b.dataset.i][b.dataset.f] = b.dataset.v; setDirty(); rerenderEditor(); return; }
    if (act==="undo") { loadDraft(); S.msg=null; S.showMissing=false; rerenderEditor(); return; }
    if (act==="discard") { S.dirty=false; applyGo(S.pendingGo); return; }
    if (act==="save") save();
  };
}

async function save(){
  if (!S.cargo) return;
  const cs = S.draft.cats;
  const faltam = CATS.filter(k => !answered({[k.k]:cs[k.k]}));
  if (faltam.length) {
    S.showMissing = true;
    S.msg = { cls:"err", txt:`Falta responder: ${faltam.map(k=>k.n).join(", ")}.` };
    rerenderEditor(); $("cat-"+faltam[0].k)?.scrollIntoView({ block:"center", behavior:"smooth" }); return;
  }
  const nome = S.who.nome.trim(), email = S.who.email.trim().toLowerCase();
  if (!nome || !validEmail(email)) {
    S.msg = { cls:"err", txt: !nome ? "Informe seu nome antes de enviar." : "Informe um e-mail válido antes de enviar." };
    rerenderEditor(); $(!nome?"who-nome":"who-email")?.focus(); return;
  }
  const itens = [], naoPrecisa = [];
  CATS.forEach(k => { const st=cs[k.k];
    if (st.estado==="nao") naoPrecisa.push(k.k);
    else st.itens.forEach(it => itens.push({ cat:k.k, categoria:k.n, recurso:it.recurso.slice(0,120), dia1:it.dia1, obs:it.obs.trim().slice(0,500), responsavel:it.responsavel.trim().slice(0,120) }));
  });
  const c = BYID[S.cargo], id = S.cargo;
  S.saving = true; rerenderEditor();
  try {
    const b = writeBatch(db);
    b.set(doc(db, "respostas", id), { area:c.area, cargo:c.cargo, itens, naoPrecisa, respondenteNome:nome.slice(0,120), respondenteEmail:email.slice(0,200), atualizadoEm:serverTimestamp() });
    b.set(doc(db, "status", id), { respondido:true, nItens:itens.length, atualizadoEm:serverTimestamp() });
    await b.commit();
    S.mine[id] = { cats: clone(cs), em: new Date().toISOString() }; store.set("acc-mine", JSON.stringify(S.mine));
    S.saving=false; S.dirty=false; S.showMissing=false; S.msg={cls:"ok",txt:"Respostas enviadas. Obrigado!"};
    if (S.pendingGo) { applyGo(S.pendingGo); return; }
    renderResponder();
  } catch (err) {
    console.error(err);
    S.saving=false;
    S.msg = { cls:"err", txt: err && err.code==="permission-denied" ? "O servidor recusou o envio. Avise o RH." : "Não foi possível enviar agora. Verifique sua conexão e tente de novo." };
    rerenderEditor();
  }
}

/* ---------- LOGIN RH ---------- */
function renderLogin(){
  const L = S.login;
  let body;
  if (S.user && !S.isRH) body = `<p>Você entrou como <b>${esc(S.user.email)}</b>, que não tem acesso ao painel do RH.</p><button type="button" class="btn" id="lg-out">Sair</button>`;
  else body = `
    <p class="meta">O painel com as respostas é restrito ao RH.</p>
    <label class="label" for="lg-email">E-mail</label><input type="text" id="lg-email" inputmode="email" autocomplete="username" value="${esc(L.email)}">
    <label class="label" for="lg-pass">Senha</label><input type="password" id="lg-pass" autocomplete="current-password" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px">
    <button type="button" class="btn primary" id="lg-go" ${L.busy?"disabled":""}>${L.busy?"Entrando…":"Entrar"}</button>`;
  $("view").innerHTML = `<div class="login"><h2>Painel do RH</h2>${body}${L.msg?`<div class="notice err" style="margin:0">${esc(L.msg)}</div>`:""}</div>`;
  $("lg-out")?.addEventListener("click", () => signOut(auth));
  $("lg-go")?.addEventListener("click", doLogin);
  ["lg-email","lg-pass"].forEach(id => $(id)?.addEventListener("keydown", e => { if (e.key==="Enter") doLogin(); }));
}
async function doLogin(){
  const L = S.login, em = ($("lg-email").value||"").trim().toLowerCase(), pw = $("lg-pass").value||"";
  L.email = em;
  if (!RH_EMAILS.includes(em)) { L.msg = "Este e-mail não tem acesso ao painel do RH."; renderLogin(); return; }
  if (!pw) { L.msg = "Digite a senha."; renderLogin(); $("lg-pass")?.focus(); return; }
  L.busy = true; L.msg = null; renderLogin();
  try { await signInWithEmailAndPassword(auth, em, pw); L.msg = null; }
  catch (e) {
    console.error(e);
    const c = e && e.code;
    L.msg = (c==="auth/invalid-credential" || c==="auth/wrong-password" || c==="auth/user-not-found" || c==="auth/invalid-login-credentials") ? "E-mail ou senha incorretos."
      : c==="auth/too-many-requests" ? "Muitas tentativas. Aguarde alguns minutos e tente de novo."
      : c==="auth/operation-not-allowed" ? "O login por e-mail e senha não está ativado no Firebase."
      : `Não foi possível entrar (${c || "erro desconhecido"}).`;
  }
  L.busy = false; if (!S.isRH) renderLogin();
}

/* ---------- PAINEL ---------- */
function allRows(){
  const rows=[];
  CARGOS.forEach(c=>{ const r=S.resp[c.id]; if(!r) return;
    CATS.forEach(k=>{
      if ((r.naoPrecisa||[]).includes(k.k)) rows.push({ c, r, k, it:null });
      (r.itens||[]).filter(it=>catOf(it)===k.k).forEach(it=>rows.push({ c, r, k, it }));
    });
  });
  return rows;
}
function renderPainel(){
  const nResp = CARGOS.filter(c=>S.resp[c.id]).length;
  const all = allRows();
  const items = all.filter(x=>x.it).length;
  const areasDone = AREAS.filter((_,i)=>{const [d,t]=areaDone(i);return d===t}).length;
  const dia1 = all.filter(x=>x.it && x.it.dia1==="Sim").length;
  const q = S.pq.toLowerCase();
  let rows = all.filter(x => (S.pArea<0 || x.c.ai===S.pArea) && (!S.pCat || x.k.k===S.pCat));
  if (q) rows = rows.filter(x => [x.c.area,x.c.cargo,x.k.n,x.it?.recurso,x.it?.obs,x.it?.responsavel,x.r.respondenteNome].join(" ").toLowerCase().includes(q));
  const pend = CARGOS.filter(c => !S.resp[c.id] && (S.pArea<0 || c.ai===S.pArea));
  const by = r => `${esc(r.respondenteNome||"—")}<span class="sm">${esc(r.respondenteEmail||"")}</span><span class="sm">${fmtDate(r.atualizadoEm)}</span>`;
  $("view").innerHTML = `
  <div class="kpis">
    <div class="kpi"><span class="label">Cargos respondidos</span><b>${nResp}<small> / ${CARGOS.length}</small></b><div class="bar" style="margin-top:8px"><i style="width:${Math.round(nResp/CARGOS.length*100)}%"></i></div></div>
    <div class="kpi"><span class="label">Setores completos</span><b>${areasDone}<small> / ${AREAS.length}</small></b></div>
    <div class="kpi"><span class="label">Itens solicitados</span><b>${items}</b></div>
    <div class="kpi"><span class="label">Itens para o 1º dia</span><b>${dia1}</b></div>
  </div>
  <div class="panel">
    <div class="card">
      <h3>Progresso por setor</h3>
      <ul class="arealist" id="area-list">
        <li><button type="button" data-a="-1" aria-current="${S.pArea<0}"><span class="n"><b>Todos os setores</b></span><span class="c">${nResp}/${CARGOS.length}</span></button></li>
        ${AREAS.map(([a],i)=>{const [d,t]=areaDone(i);return `<li><button type="button" data-a="${i}" aria-current="${S.pArea===i}"><span class="n">${esc(a)}</span><span class="c">${d}/${t}</span><span class="bar"><i style="width:${Math.round(d/t*100)}%;${d===t?"background:var(--ok)":""}"></i></span></button></li>`}).join("")}
      </ul>
    </div>
    <div class="card" style="min-width:0">
      <div class="filters">
        <input type="search" id="p-q" placeholder="Buscar cargo, sistema, gestor…" value="${esc(S.pq)}">
        <select id="p-cat"><option value="">Todas as categorias</option>${CATS.map(k=>`<option value="${k.k}" ${k.k===S.pCat?"selected":""}>${esc(k.n)}</option>`).join("")}</select>
        <button type="button" class="btn primary" id="btn-xlsx">Baixar Excel</button>
      </div>
      ${pend.length ? `<details class="notice" style="margin-bottom:12px"><summary>${pend.length} ${pend.length===1?"cargo pendente":"cargos pendentes"}${S.pArea>=0?" neste setor":""}</summary><ul class="pend">${pend.map(c=>`<li><b>${esc(c.cargo)}</b> <span class="meta">· ${esc(c.area)}</span></li>`).join("")}</ul></details>` : ""}
      ${rows.length ? `<div class="tblwrap"><table>
        <thead><tr><th>Cargo</th><th>Categoria</th><th>Recurso / sistema / acesso</th><th>1º dia</th><th>Observações</th><th>Responsável</th><th>Respondido por</th></tr></thead>
        <tbody>${rows.map(({c,r,k,it})=> it ? `<tr>
          <td class="cg">${esc(c.cargo)}<span class="sm">${esc(c.area)}</span></td><td>${esc(k.n)}</td><td><b>${esc(it.recurso)}</b></td>
          <td><span class="yn ${it.dia1==="Sim"?"s":"n"}">${esc(it.dia1)}</span></td><td>${esc(it.obs)}</td><td>${esc(it.responsavel)}</td><td>${by(r)}</td></tr>`
          : `<tr class="np"><td class="cg">${esc(c.cargo)}<span class="sm">${esc(c.area)}</span></td><td>${esc(k.n)}</td><td colspan="4">Não precisa</td><td>${by(r)}</td></tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">${S.loaded ? (nResp ? "Nenhuma resposta com esses filtros." : "<b>Nenhuma resposta ainda.</b><br>Envie o link do site para os gestores; as respostas aparecem aqui assim que eles enviarem.") : "Carregando respostas…"}</div>`}
    </div>
  </div>`;
  $("area-list").onclick = e => { const b=e.target.closest("[data-a]"); if(b){ S.pArea=+b.dataset.a; renderPainel(); } };
  $("p-q").oninput = e => { S.pq=e.target.value; const pos=e.target.selectionStart; renderPainel(); const el=$("p-q"); el.focus(); el.setSelectionRange(pos,pos); };
  $("p-cat").onchange = e => { S.pCat=e.target.value; renderPainel(); };
  $("btn-xlsx").onclick = exportXlsx;
}
function exportXlsx(){
  const head = ["Área / setor","Cargo","Categoria","Recurso / sistema / acesso necessário","Necessário desde o 1º dia?","Observações / especificações","Responsável (opcional)","Respondido por","E-mail","Data da resposta"];
  const data = [head];
  CARGOS.forEach(c => { const r=S.resp[c.id];
    if (!r) { data.push([c.area,c.cargo,"","PENDENTE","","","","","",""]); return; }
    const who = [r.respondenteNome||"", r.respondenteEmail||"", fmtDate(r.atualizadoEm)];
    CATS.forEach(k => {
      if ((r.naoPrecisa||[]).includes(k.k)) data.push([c.area,c.cargo,k.n,"Não precisa","","","",...who]);
      (r.itens||[]).filter(it=>catOf(it)===k.k).forEach(it => data.push([c.area,c.cargo,k.n,it.recurso,it.dia1,it.obs,it.responsavel,...who]));
    });
  });
  const summary = [["Área / setor","Cargos","Respondidos","Pendentes"], ...AREAS.map(([a],i)=>{const [d,t]=areaDone(i);return [a,t,d,t-d]})];
  const day = new Date().toISOString().slice(0,10);
  let blob, name;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(data); ws["!cols"]=[30,34,30,34,14,40,22,24,30,16].map(w=>({wch:w})); ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:data.length-1,c:head.length-1}})};
    XLSX.utils.book_append_sheet(wb, ws, "Levantamento");
    const ws2 = XLSX.utils.aoa_to_sheet(summary); ws2["!cols"]=[{wch:50},{wch:10},{wch:12},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws2, "Progresso por setor");
    blob = new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }); name = `levantamento-acessos-${day}.xlsx`;
  } else {
    blob = new Blob(["﻿" + data.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n")], { type:"text/csv" }); name = `levantamento-acessos-${day}.csv`;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- boot ---------- */
function onData(){
  if (S.cargo && !S.dirty && !S.saving) loadDraft();
  if (route()==="responder" && (S.dirty || $("editor")?.contains(document.activeElement))) {
    renderNotices();
    $("cargo-list")?.querySelectorAll("[data-cargo]").forEach(b=>{const s=status(b.dataset.cargo); const p=b.querySelector(".pill"); p.className="pill "+s.cls; p.textContent=s.txt;});
    return;
  }
  if (route()==="painel" && document.activeElement && document.activeElement.id==="p-q") { renderPainel(); $("p-q").focus(); return; }
  render();
}
function boot(){
  const a = parseInt(store.get("acc-area"),10); if (a>=0 && a<AREAS.length) S.area=a;
  render();
  const timer = setTimeout(()=>{ S.slow=true; renderNotices(); }, 10000);
  onSnapshot(collection(db, "status"), snap => {
    const next={}; snap.docs.forEach(d=>{ if(BYID[d.id]) next[d.id]=d.data(); });
    S.status=next; S.loaded=true; S.slow=false; clearTimeout(timer); onData();
  }, err => { console.error(err); clearTimeout(timer); S.err = err.code==="permission-denied" ? "Acesso ao banco recusado. Avise o RH." : "Verifique sua conexão e recarregue a página."; renderNotices(); });
  onAuthStateChanged(auth, u => {
    S.user = u;
    S.isRH = !!(u && RH_EMAILS.includes((u.email||"").toLowerCase()));
    if (unsubResp) { unsubResp(); unsubResp = null; S.resp = {}; }
    if (S.isRH) unsubResp = onSnapshot(collection(db, "respostas"), snap => {
      const next={}; snap.docs.forEach(d=>{ if(BYID[d.id]) next[d.id]=d.data(); }); S.resp=next; onData();
    }, err => { console.error(err); S.err = "Não foi possível ler as respostas. Confira as regras do Firestore."; renderNotices(); });
    if (S.cargo && !S.dirty) loadDraft();
    render();
  });
  $("btn-logout").onclick = () => signOut(auth);
  addEventListener("hashchange", render);
}
boot();
</script>
